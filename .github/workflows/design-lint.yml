name: DESIGN.md lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-md-lint:
    name: Validate .claude/DESIGN.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Make lint script executable
        run: chmod +x .github/scripts/design-md-lint.sh
      - name: Run DESIGN.md lint
        run: bash .github/scripts/design-md-lint.sh

      # The heading lint above cannot see whether the tokens DESIGN.md declares
      # are real. It passed for months while the file documented an orange
      # palette the app has never shipped, so every agent that generated UI
      # from it produced off-brand work. This step compares the declared tokens
      # against app/globals.css, which is the source of truth.
      - name: Verify DESIGN.md tokens match app/globals.css
        run: node scripts/check-design-tokens.mjs
