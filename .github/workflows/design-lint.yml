name: DESIGN.md lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-md-lint:
    name: Validate .claude/DESIGN.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Make lint script executable
        run: chmod +x .github/scripts/design-md-lint.sh
      - name: Run DESIGN.md lint
        run: bash .github/scripts/design-md-lint.sh
