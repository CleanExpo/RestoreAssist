name: Smoke — Production

on:
  schedule:
    # Outage watch. A stale deploy is REPORTED here but does not fail the run
    # -- see "Verify production is serving this revision" below for why.
    - cron: "*/15 * * * *"
    # Staleness report. Identical checks, but a stale deploy DOES fail on this
    # schedule, so an unpromoted production is chased once a day rather than
    # ninety-six times.
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-prod-production
  cancel-in-progress: false

jobs:
  reject-non-main:
    name: Reject non-main smoke request
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          echo "Production smoke may only run from refs/heads/main." >&2
          exit 1

  provenance:
    name: Prove exact main provenance before production access
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: node scripts/ci/verify-release-provenance.mjs

  smoke:
    name: Smoke against prod
    needs: provenance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # issues: write is for the last step only, which opens the outage issue.
    # Scoped to this job so the provenance and reject jobs stay read-only.
    permissions:
      contents: read
      issues: write
    environment:
      name: production
      url: https://restoreassist.app
    steps:
      - name: Checkout proven revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          HUSKY: "0"

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium

      - name: Bind smoke target to canonical production
        env:
          PLAYWRIGHT_BASE_URL: https://restoreassist.app
        run: node scripts/ci/assert-production-smoke-origin.mjs "$PLAYWRIGHT_BASE_URL"

      # Split from the smoke run so the two failures are told apart at a
      # glance in the checks list. Exit 3 from the runner means stale; exit 1
      # means production is broken.
      #
      # WHY STALENESS NO LONGER FAILS THE FIFTEEN-MINUTE WATCH
      # -----------------------------------------------------
      # Production has not been promoted since 2026-08-25, so this step
      # returned exit 3 on every run -- ~96 identical failure emails a day.
      # That is alert fatigue, but the worse half is that failing here ABORTED
      # THE JOB, so the user-flow smoke below never ran. For over a day this
      # workflow tested nothing about production, and a genuine outage would
      # have produced exactly the same red run everyone had learned to ignore.
      #
      # So: staleness is a release problem, not an outage. It is reported as a
      # warning on the watch and fails once a day on the dedicated schedule (or
      # on demand via workflow_dispatch, where you asked the question directly).
      # Anything that is NOT staleness still fails immediately, as before.
      - name: Verify production is serving this revision
        id: freshness
        env:
          PLAYWRIGHT_BASE_URL: https://restoreassist.app
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
          EXPECTED_DATABASE_FINGERPRINT: ${{ secrets.EXPECTED_DATABASE_FINGERPRINT }}
          CI: true
          STALE_FAILS_THE_RUN: >-
            ${{ github.event_name == 'workflow_dispatch'
            || github.event.schedule == '23 22 * * *' }}
        run: |
          set +e
          node scripts/run-smoke.mjs https://restoreassist.app --preflight-only
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exit 4 means the deployment will not say which build it is, so the
          # question could not be ANSWERED -- distinct from stale, which is an
          # answer. Nothing injects a commit SHA on DigitalOcean today, so this
          # is the permanent state until GIT_SHA is set in the app spec. It is
          # surfaced the same way staleness is: a warning on the frequent watch
          # so an outage alarm is not drowned out, and a failure on the daily
          # dedicated run so a blind freshness check cannot stay blind unnoticed.
          if [ "$code" -eq 4 ]; then
            echo "stale=unverifiable" >> "$GITHUB_OUTPUT"
            if [ "$STALE_FAILS_THE_RUN" = "true" ]; then
              echo "::error::Which build production is running cannot be verified: /api/health reports no deploymentSha. Set GIT_SHA in the DigitalOcean app spec so this check carries information."
              exit 4
            fi
            echo "::warning::Which build production is running cannot be verified (no deploymentSha). Not an outage, and not evidence of staleness -- the daily 22:23 UTC run fails on this. Flow smoke continues below."
          # Only exit 3 means "stale". Anything else is a preflight that could
          # not answer the question, which is never something to wave through.
          elif [ "$code" -ne 3 ]; then
            echo "::error::Production preflight failed with exit $code -- this is not staleness."
            exit "$code"
          else

            echo "stale=true" >> "$GITHUB_OUTPUT"
            if [ "$STALE_FAILS_THE_RUN" = "true" ]; then
              echo "::error::Production is stale: main has moved ahead of the deployed build. Promote a release."
              exit 3
            fi
            echo "::warning::Production is stale (serving an older build than main). Not an outage -- the daily 22:23 UTC run fails on this. Flow smoke continues below."
          fi

      # Runs even when production is stale. Against a stale build this proves
      # availability rather than that THIS revision works -- which is exactly
      # what an outage watch needs, and what the old abort-on-stale behaviour
      # threw away.
      - name: Run origin-bound production smoke
        id: flows
        env:
          PLAYWRIGHT_BASE_URL: https://restoreassist.app
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
          EXPECTED_DATABASE_FINGERPRINT: ${{ secrets.EXPECTED_DATABASE_FINGERPRINT }}
          CI: true
        run: >-
          node scripts/run-smoke.mjs
          https://restoreassist.app
          --allow-stale
          --flows-despite-degraded
          --no-deps
          --project=chromium

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      # RA-7648 — a red production smoke has to reach a person. GitHub's
      # failure email alone was ignored because the daily run is red on
      # purpose. This opens ONE issue labelled smoke-prod-red per outage: while
      # one is open, later red runs add nothing, so an outage does not open 96
      # issues a day. Close the issue once production is green again; the next
      # outage opens a fresh one.
      #
      # The daily 22:23 UTC run (and a manual run) fails on purpose when
      # production is stale or cannot say which build it is: exit 3 or 4 from
      # the freshness step, which records stale=true or stale=unverifiable
      # before exiting. That is a release problem, not an outage, so it does
      # not open the issue. Otherwise that one deliberate red would hold the
      # issue open and every real outage after it would open nothing. Anything
      # else that fails -- the flows, a preflight error that records no stale
      # value, or a setup step before the preflight ran -- does open it.
      - name: Open one issue while production smoke is red
        if: >-
          failure()
          && (steps.flows.outcome == 'failure'
          || steps.freshness.outputs.stale == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create smoke-prod-red --force --color B60205 \
            --description "Production smoke is failing. One open issue per outage."
          open=$(gh issue list --label smoke-prod-red --state open --limit 1 --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "An open smoke-prod-red issue already exists; not opening another."
            exit 0
          fi
          gh issue create \
            --title "[smoke-prod] Production smoke is red $(date -u +%Y-%m-%d)" \
            --label smoke-prod-red \
            --body "The production smoke check against https://restoreassist.app failed. Run: $RUN_URL

          While this issue is open, later red runs will not open another one. Close it once production smoke is green again, so the next outage opens a fresh issue."
