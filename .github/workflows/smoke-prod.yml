name: Smoke — Production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-prod-production
  cancel-in-progress: false

jobs:
  reject-non-main:
    name: Reject non-main smoke request
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          echo "Production smoke may only run from refs/heads/main." >&2
          exit 1

  provenance:
    name: Prove exact main provenance before production access
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: node scripts/ci/verify-release-provenance.mjs

  smoke:
    name: Smoke against prod
    needs: provenance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://restoreassist.app
    steps:
      - name: Checkout proven revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          HUSKY: "0"

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium

      - name: Bind smoke target to canonical production
        env:
          PLAYWRIGHT_BASE_URL: https://restoreassist.app
        run: node scripts/ci/assert-production-smoke-origin.mjs "$PLAYWRIGHT_BASE_URL"

      # Split from the smoke run so the two failures are told apart at a
      # glance in the checks list. A stale deploy fails HERE, under a step
      # named for what is actually wrong, and the user-flow step below never
      # runs -- testing flows against a revision that is not this one proves
      # nothing about this one. A genuine outage or regression fails BELOW.
      # Exit 3 from the runner means stale; exit 1 means production is broken.
      - name: Verify production is serving this revision
        env:
          PLAYWRIGHT_BASE_URL: https://restoreassist.app
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
          EXPECTED_DATABASE_FINGERPRINT: ${{ secrets.EXPECTED_DATABASE_FINGERPRINT }}
          CI: true
        run: >-
          node scripts/run-smoke.mjs
          https://restoreassist.app
          --preflight-only

      - name: Run origin-bound production smoke
        env:
          PLAYWRIGHT_BASE_URL: https://restoreassist.app
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
          EXPECTED_DATABASE_FINGERPRINT: ${{ secrets.EXPECTED_DATABASE_FINGERPRINT }}
          CI: true
        run: >-
          node scripts/run-smoke.mjs
          https://restoreassist.app
          --no-deps
          --project=chromium

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
