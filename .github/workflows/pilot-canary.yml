name: Pilot tester canary

on:
  workflow_call:
    inputs:
      base_url:
        description: "Exact sandbox origin exercised by the canary"
        required: false
        type: string
        default: "https://restoreassist-sandbox.vercel.app"
    outputs:
      provisioned:
        description: >-
          "true" when all eight pilot secrets are present and the swarm actually
          graded this SHA. Callers must treat anything else as "no canary
          evidence" rather than as a pass.
        value: ${{ jobs.secrets-gate.outputs.provisioned }}
    secrets:
      # DELIBERATELY NOT `required: true`. Under workflow_call, a required
      # secret that does not exist fails the calling job at INITIALISATION --
      # zero steps, no logs, and a 404 on the log endpoint. That is how an
      # unprovisioned canary took down the release gate with a failure nobody
      # could read; it was only diagnosable by dispatching this workflow
      # directly. Presence is checked in secrets-gate below, which can report
      # what is missing.
      PILOT_TESTER_USER_POOL_JSON:
        required: false
      PILOT_TESTER_DATABASE_URL:
        required: false
      PILOT_TESTER_ALLOWED_DATABASE_HOSTS:
        required: false
      RESTOREASSIST_AI_API_KEY:
        required: false
      PILOT_TESTER_JUDGE_API_KEY:
        required: false
      UNSPLASH_ACCESS_KEY:
        required: false
      PILOT_TESTER_EVIDENCE_BUNDLE_URL:
        required: false
      PILOT_TESTER_EVIDENCE_BUNDLE_SHA256:
        required: false
  schedule:
    # 16:00 UTC = 02:00 AEST next-day (off-peak for the sandbox).
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Exact approved sandbox base URL"
        required: true
        default: "https://restoreassist-sandbox.vercel.app"
  pull_request:
    paths:
      - "packages/pilot-tester/**"
      - "app/api/pilot-tester/**"
      - "app/api/inspections/[id]/assessments/[type]/generate/**"
      - "lib/pilot-tester/**"
      - "lib/ai/adjuster-agent.ts"
      - "lib/ai/restoreassist-ai-client.ts"
      - "lib/workspace/permissions.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - ".github/workflows/pilot-canary.yml"

permissions:
  contents: read

jobs:
  # Per-PR self-test — needs no secrets, no creds, no network.
  # Catches harness-internal regressions (safety guard, fixtures,
  # reporter, baseline analyser) without consuming AI budget.
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install workspace deps
        run: npm ci --ignore-scripts
        env:
          HUSKY: "0"
      - name: Vitest
        working-directory: packages/pilot-tester
        run: npm test
      - name: Dry-run
        working-directory: packages/pilot-tester
        run: npm run dryrun

  # Presence preflight. A canary without its account pool, sandbox database or
  # independent judge is not release evidence -- but it is also not a reason to
  # block a release, which is what exiting non-zero here did: it skipped the
  # release-gate score job, so no receipt artifact was produced and production
  # could not be promoted at all.
  #
  # This job therefore REPORTS rather than blocks. What stops an unprovisioned
  # canary from pretending it graded anything is the `swarm` job below, which
  # still refuses to run unless `provisioned == 'true'`, and the release gate,
  # which states plainly when a score carries no canary evidence.
  secrets-gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      provisioned: ${{ steps.check.outputs.provisioned }}
    steps:
      - name: Check pilot secrets presence
        id: check
        env:
          POOL_JSON: ${{ secrets.PILOT_TESTER_USER_POOL_JSON }}
          DATABASE_URL: ${{ secrets.PILOT_TESTER_DATABASE_URL }}
          RESTOREASSIST_AI_API_KEY: ${{ secrets.RESTOREASSIST_AI_API_KEY }}
          PILOT_TESTER_JUDGE_API_KEY: ${{ secrets.PILOT_TESTER_JUDGE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          EVIDENCE_BUNDLE_URL: ${{ secrets.PILOT_TESTER_EVIDENCE_BUNDLE_URL }}
          EVIDENCE_BUNDLE_SHA256: ${{ secrets.PILOT_TESTER_EVIDENCE_BUNDLE_SHA256 }}
          ALLOWED_DATABASE_HOSTS: ${{ secrets.PILOT_TESTER_ALLOWED_DATABASE_HOSTS }}
        run: |
          # Names only, never values -- this string is printed to a public log.
          # Naming each missing secret matters most in the partly-provisioned
          # case: "all of them are required" tells someone who has set six of
          # eight nothing at all about which two are left.
          MISSING=""
          [ -n "${POOL_JSON:-}" ]                   || MISSING="$MISSING PILOT_TESTER_USER_POOL_JSON"
          [ -n "${DATABASE_URL:-}" ]                || MISSING="$MISSING PILOT_TESTER_DATABASE_URL"
          [ -n "${ALLOWED_DATABASE_HOSTS:-}" ]      || MISSING="$MISSING PILOT_TESTER_ALLOWED_DATABASE_HOSTS"
          [ -n "${RESTOREASSIST_AI_API_KEY:-}" ]    || MISSING="$MISSING RESTOREASSIST_AI_API_KEY"
          [ -n "${PILOT_TESTER_JUDGE_API_KEY:-}" ]  || MISSING="$MISSING PILOT_TESTER_JUDGE_API_KEY"
          [ -n "${UNSPLASH_ACCESS_KEY:-}" ]         || MISSING="$MISSING UNSPLASH_ACCESS_KEY"
          [ -n "${EVIDENCE_BUNDLE_URL:-}" ]         || MISSING="$MISSING PILOT_TESTER_EVIDENCE_BUNDLE_URL"
          [ -n "${EVIDENCE_BUNDLE_SHA256:-}" ]      || MISSING="$MISSING PILOT_TESTER_EVIDENCE_BUNDLE_SHA256"

          if [ -z "$MISSING" ]; then
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pilot canary cannot grade this SHA::The canary is ADVISORY on this run: it graded nothing. Repository secrets not set:${MISSING}."
          fi

  swarm:
    # Runs for schedule, manual dispatch, and trusted reusable-workflow calls;
    # never on PRs, which must not consume sandbox AI budget.
    needs: secrets-gate
    if: github.event_name != 'pull_request' && needs.secrets-gate.outputs.provisioned == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install root deps (for prisma client + lib types)
        run: npm ci --ignore-scripts
        env:
          HUSKY: "0"

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Hydrate immutable canary evidence bundle
        env:
          EVIDENCE_BUNDLE_URL: ${{ secrets.PILOT_TESTER_EVIDENCE_BUNDLE_URL }}
          EVIDENCE_BUNDLE_SHA256: ${{ secrets.PILOT_TESTER_EVIDENCE_BUNDLE_SHA256 }}
        run: |
          set -euo pipefail
          case "$EVIDENCE_BUNDLE_URL" in https://*) ;; *) echo "::error ::Evidence bundle URL must use HTTPS"; exit 2;; esac
          if [[ ! "$EVIDENCE_BUNDLE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error ::Evidence bundle SHA-256 is malformed"
            exit 2
          fi
          ARCHIVE="$RUNNER_TEMP/pilot-evidence.tar.gz"
          MEMBERS="$RUNNER_TEMP/pilot-evidence.members"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$EVIDENCE_BUNDLE_URL" --output "$ARCHIVE"
          printf '%s  %s\n' "${EVIDENCE_BUNDLE_SHA256,,}" "$ARCHIVE" | sha256sum --check --strict
          tar -tzf "$ARCHIVE" > "$MEMBERS"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$MEMBERS"; then
            echo "::error ::Evidence bundle contains an unsafe path"
            exit 2
          fi
          if awk '
            /\/$/ { next }
            $0 == "baselines/sandbox.json" { next }
            $0 == "baselines/source-report.json" { next }
            $0 == "src/images/manifest.json" { next }
            $0 ~ /^src\/images\/cache\/[0-9a-fA-F]{40}\.jpg$/ { next }
            { bad=1 }
            END { exit bad }
          ' "$MEMBERS"; then :; else
            echo "::error ::Evidence bundle contains an unexpected file"
            exit 2
          fi
          for required in baselines/sandbox.json baselines/source-report.json src/images/manifest.json; do
            grep -Fxq "$required" "$MEMBERS" || { echo "::error ::Evidence bundle missing $required"; exit 2; }
          done
          grep -Eq '^src/images/cache/[0-9a-fA-F]{40}\.jpg$' "$MEMBERS" || { echo "::error ::Evidence bundle has no cached JPEGs"; exit 2; }
          tar -xzf "$ARCHIVE" -C packages/pilot-tester --no-same-owner --no-same-permissions

      - name: Prove canary baseline and licensed evidence fixtures
        working-directory: packages/pilot-tester
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PILOT_TESTER_JUDGE_API_KEY: ${{ secrets.PILOT_TESTER_JUDGE_API_KEY }}
        run: npm run preflight

      - name: Write user-pool from secret
        env:
          POOL_JSON: ${{ secrets.PILOT_TESTER_USER_POOL_JSON }}
        # CRITICAL: do NOT interpolate ${{ secrets.* }} directly into a
        # shell script — backticks / $(...) / ; in the secret would
        # execute. Pass via env and use printf with a quoted shell var
        # so the runtime never re-parses the value.
        run: |
          mkdir -p packages/pilot-tester
          printf '%s' "$POOL_JSON" > packages/pilot-tester/user-pool.json

      - name: Prove exact five-company sandbox identity pool
        working-directory: packages/pilot-tester
        run: npm run validate:user-pool -- ./user-pool.json

      - name: Run swarm
        working-directory: packages/pilot-tester
        env:
          PILOT_TESTER_BASE_URL: ${{ inputs.base_url || 'https://restoreassist-sandbox.vercel.app' }}
          PILOT_TESTER_USER_POOL: ./user-pool.json
          PILOT_TESTER_REVISION: ${{ github.sha }}
          PILOT_TESTER_DAILY_BUDGET_USD: "5"
          PILOT_TESTER_DATABASE_URL: ${{ secrets.PILOT_TESTER_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.PILOT_TESTER_DATABASE_URL }}
          RESTOREASSIST_AI_API_KEY: ${{ secrets.RESTOREASSIST_AI_API_KEY }}
          PILOT_TESTER_JUDGE_API_KEY: ${{ secrets.PILOT_TESTER_JUDGE_API_KEY }}
          PILOT_TESTER_ALLOWED_BASE_URLS: https://restoreassist-sandbox.vercel.app
          PILOT_TESTER_ALLOWED_DATABASE_HOSTS: ${{ secrets.PILOT_TESTER_ALLOWED_DATABASE_HOSTS }}
        run: npm run swarm -- --concurrency 3

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pilot-tester-report-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: packages/pilot-tester/reports/
          retention-days: 30
