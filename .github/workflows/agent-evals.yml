name: Agent evals

# Regression tests for the agent's own configuration.
#
# .claude/ holds 62 skills, 33 rules, two always-on rule files, eight slash
# commands, four subagents and a Stop-hook verifier. All of it steers every
# session in this repository, and none of it had a test until now. A skill that
# stops triggering, or a rule reworded into vagueness, is invisible otherwise.
#
# COST: none in the default mode. The fixture run is regex checks against
# recorded answers — no API key, no network, no model call. It gates changes to
# the configuration itself, which is where the regressions come from.
#
# The --live mode calls a real agent and does cost money, so it is not wired
# here. Run it locally when you want to know what the agent actually does today:
#   bash evals/check.sh --live

on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "REVIEW.md"
      - ".claude/**"
      - "evals/**"
  schedule:
    # Nightly, so a skill broken by an upstream change surfaces without waiting
    # for someone to touch .claude/ again.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # The eval suite and the guard tests are pure bash and jq. Only the
      # ledger-append agreement probe needs tsx, and it is the assertion most
      # worth keeping — it proves the shell writer and the TypeScript writer
      # still produce the same line shape. So node is installed for that one
      # step rather than the probe being dropped.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: 1
        run: npm ci --ignore-scripts

      - name: Run the eval suite
        run: bash evals/check.sh

      # The hook guards are configuration too, and they are the reason this
      # suite exists: both shipped inert, printing BLOCKED while allowing the
      # command. Their behaviour test runs here rather than in vitest because
      # they are shell, not TypeScript.
      - name: Run the PreToolUse guard tests
        run: bash .claude/hooks/tests/test-guards.sh

      # The Stop hook's metrics write. Its own shape must stay identical to the
      # TypeScript writer's, or two records of one event disagree.
      - name: Run the ledger-append tests
        run: bash .claude/hooks/tests/test-ledger-append.sh
