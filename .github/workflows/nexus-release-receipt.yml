name: Nexus release receipt (CI)

# Posts the `nexus/release-receipt` commit status from CI, so a receipt no longer
# needs a manual gate run on Phill's MacBook (UNI-3575). Codex reviews the PR's
# diff against its base; the receipt is success only when Codex returns PASS
# with zero P0/P1 findings (fail-closed, scripts/ci/nexus-receipt/verdict.mjs).
# Type-check, lint and tests stay in pr-checks.yml and are required separately.
#
# SECURITY: this job holds a Codex credential, so it must never run PR code.
#   - `pull_request_target`: GitHub runs THIS file and the scripts from the base
#     branch (main), so a PR cannot edit the workflow to reach the secret.
#   - The PR head is checked out into ./pr only to be READ by Codex. Nothing
#     from ./pr is installed or executed by the runner. Commands the model runs
#     go through a deny-by-default sandbox profile that cannot see the login
#     or the network (RA-8676; proven on every change by
#     nexus-sandbox-proof.yml, and checked again by the preflight step).
#   - Nothing Codex wrote is posted. The status and the PR comment carry fixed
#     wording and finding COUNTS only (scripts/ci/nexus-receipt/lib.mjs, rule 2).
#     The scrub step below is a second layer for the file on disk, not the
#     protection for anything public.
# Put the secret on the `nexus-release-receipt` environment (Settings →
# Environments), not as a repository secret.
#
# The secret: CODEX_AUTH_JSON, the contents of ~/.codex/auth.json from a Mac
# logged in to Codex with ChatGPT. No API key and no API spend (Phill,
# 2026-11-27: "We dont use API credits"). Without the secret the job posts
# nothing and the Mac gate works as before.
#
# A blocked PR is never silent: ONE PR comment, updated in place, says how many
# findings block it at each severity. It does not carry the finding text; whoever
# fixes the PR runs the release-gate review locally on the same commit to read
# it. A push re-runs this review on the new commit.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: nexus-release-receipt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The verdict logic is the gate itself, so its fail-closed tests run on every
  # PR. Base-branch code only (pull_request_target's default checkout).
  verdict-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/ci/nexus-receipt/verdict.test.mjs scripts/ci/nexus-receipt/sandbox.test.mjs

  receipt:
    # The receipt is only as good as the verdict logic that decides it, so this
    # job runs only when verdict-tests SUCCEEDED on the same commit. If those
    # tests fail, are cancelled or are skipped, this job is skipped and posts
    # nothing: no new success can appear on a commit whose verdict logic is
    # unproven. (A status an earlier run already posted on that commit stays.)
    needs: verdict-tests
    # Fork PRs are skipped: the receipt is for this repo's own branches.
    # Keep this condition exactly as written. GitHub only adds "and every needed
    # job succeeded" while the condition calls none of always(), failure(),
    # cancelled() or success(); adding one would let this job run after failed
    # tests. scripts/ci/__tests__/nexus-receipt-workflow.test.mjs fails if this
    # line or the `needs` above changes.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nexus-release-receipt
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # `runner` is not available in job-level env, so set paths here.
      # CODEX_EXIT starts as not-run: if the review never runs, the receipt fails.
      # The helper has no default either: an unset or empty CODEX_EXIT also fails.
      - name: Set paths
        run: |
          echo "CODEX_HOME=$RUNNER_TEMP/codex" >> "$GITHUB_ENV"
          echo "CODEX_EXIT=not-run" >> "$GITHUB_ENV"

      - name: Check a Codex credential is configured
        id: cred
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -n "$CODEX_AUTH_JSON" ]; then echo "mode=chatgpt" >> "$GITHUB_OUTPUT";
          else
            echo "::notice::No CODEX_AUTH_JSON secret; no CI receipt posted."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      # Trusted: the base branch's scripts (verdict logic, schema).
      - name: Checkout base (trusted)
        if: steps.cred.outputs.mode != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false

      # Untrusted: the PR head, read by Codex only. Never installed or run.
      - name: Checkout PR head (read only)
        if: steps.cred.outputs.mode != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      # The PR controls pr/.codex. Codex would load hooks and MCP commands from
      # it and run them as the Codex process, outside the sandbox and next to
      # the login. The review reads the diff from git objects, so nothing is
      # lost; nothing in the PR tree may be loaded as Codex configuration. The
      # owner also refuses to start while pr/.codex exists (RA-8676).
      - name: Remove PR-supplied Codex configuration
        if: steps.cred.outputs.mode != 'none'
        run: rm -rf pr/.codex

      - name: Setup Node.js
        if: steps.cred.outputs.mode != 'none'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.nvmrc

      - name: Mark receipt pending
        if: steps.cred.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending \
            -f context=nexus/release-receipt -f description="Codex review running (CI)" \
            -f target_url="$RUN_URL" >/dev/null

      # The pinned version, the sandbox profile, the environment allow-list and
      # the review command all live in ONE owner,
      # scripts/ci/nexus-receipt/sandbox.mjs (RA-8676). These steps call it and
      # never copy what it holds.
      - name: Install Codex
        if: steps.cred.outputs.mode != 'none'
        run: node trusted/scripts/ci/nexus-receipt/sandbox.mjs install

      # Deny-by-default profile: commands the model runs see only the system
      # roots and the PR checkout, never $CODEX_HOME, with the network cut and
      # only a core set of environment variables.
      - name: Write sandbox config
        if: steps.cred.outputs.mode != 'none'
        run: node trusted/scripts/ci/nexus-receipt/sandbox.mjs write-config "$CODEX_HOME"

      - name: Write Codex login
        if: steps.cred.outputs.mode != 'none'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          # A JSON secret is not masked value by value, so mask each credential
          # string explicitly before Codex can print anything.
          node trusted/scripts/ci/nexus-receipt/verdict.mjs --mask "$CODEX_HOME/auth.json"

      # Changes nothing unless the sandbox cannot start AND the Ubuntu AppArmor
      # user-namespace restriction is the reason; it says what it found and did.
      - name: Prepare runner for the sandbox
        if: steps.cred.outputs.mode != 'none'
        run: node trusted/scripts/ci/nexus-receipt/sandbox.mjs prepare-host --checkout pr --codex-home "$CODEX_HOME"

      # On the real layout, with the real login file in place: the login, a fake
      # file outside the checkout, an environment canary and the network must
      # all be denied, and reading the checkout and running git must work.
      # Byte counts only; nothing is printed. A breach, a failed control or a
      # probe that could not run fails this step, and the review does not run.
      - name: Sandbox preflight
        id: preflight
        if: steps.cred.outputs.mode != 'none'
        run: |
          git -C pr fetch --no-tags origin "$BASE_REF"
          node trusted/scripts/ci/nexus-receipt/sandbox.mjs preflight --checkout pr --codex-home "$CODEX_HOME" --base "$BASE_REF"

      # Runs only after a clean preflight. The owner builds the command, cuts
      # the environment to an allow-list, keeps all Codex output in a log file
      # (never the job log), and stops a hung review after 15 minutes. The exit
      # code is kept: a crash after writing PASS must fail.
      - name: Codex review of the diff
        if: steps.cred.outputs.mode != 'none' && steps.preflight.outcome == 'success'
        run: |
          set +e
          node trusted/scripts/ci/nexus-receipt/sandbox.mjs review --checkout pr --base "$BASE_REF" \
            --schema trusted/scripts/ci/nexus-receipt/schema.json \
            --out "$RUNNER_TEMP/verdict.json" --log "$RUNNER_TEMP/codex.log"
          code=$?
          set -e
          echo "CODEX_EXIT=$code" >> "$GITHUB_ENV"
          echo "Codex exited $code"

      # Second layer, for the file on disk. Nothing public depends on it.
      - name: Scrub credentials from the verdict
        if: always() && steps.cred.outputs.mode != 'none'
        run: |
          node trusted/scripts/ci/nexus-receipt/verdict.mjs --scrub "$RUNNER_TEMP/verdict.json" "$CODEX_HOME/auth.json"
          rm -rf "$CODEX_HOME" "$RUNNER_TEMP/codex.log"

      # always(): a failed earlier step must still end in a failure status, never
      # leave the receipt stuck at pending.
      - name: Post receipt
        if: always() && steps.cred.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          line=$(node trusted/scripts/ci/nexus-receipt/verdict.mjs "$RUNNER_TEMP/verdict.json")
          code=$?
          set -e
          # Fail closed when the helper is missing or prints nothing (e.g. the
          # trusted checkout failed): GitHub rejects an empty state, which would
          # leave the receipt stuck at pending.
          case "$line" in
            success\|*|failure\|*) state="${line%%|*}"; desc="${line#*|}" ;;
            *) state=failure; desc="Receipt helper produced no verdict"; code=1 ;;
          esac
          echo "Verdict: $line"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" \
            -f context=nexus/release-receipt -f description="$desc" -f target_url="$RUN_URL" >/dev/null
          exit $code

      # Counts only: the helper never copies finding text into the comment.
      - name: Publish finding counts to the PR
        if: always() && steps.cred.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          V=trusted/scripts/ci/nexus-receipt/verdict.mjs
          passed=0
          node "$V" "$RUNNER_TEMP/verdict.json" >/dev/null && passed=1
          body=$(node "$V" --comment "$RUNNER_TEMP/verdict.json" "$HEAD_SHA" "$RUN_URL")
          # --paginate: the receipt comment may sit beyond the first 100 comments.
          # Only this workflow's own comments (github-actions[bot]): anyone can type the
          # marker, and a user's comment must never be overwritten or trusted.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '.[]|select(.user.login=="github-actions[bot]" and (.body|startswith("<!-- nexus-release-receipt -->")))|.id' | head -n1)
          # A clean pass with no earlier block needs no comment (no noise).
          if [ "$passed" = 1 ] && [ -z "$id" ]; then exit 0; fi
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
