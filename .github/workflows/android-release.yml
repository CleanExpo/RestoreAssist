name: Android Release — Google Play

# Reusable only. Direct tag/manual publishing was fail-open because it ran in
# parallel with the release gate. A gated orchestrator may call this workflow
# after score, version/build and owner-approval receipts are proven.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  release-android:
    name: Build & Upload Signed AAB to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mobile-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      # Server-hosted WebView — no Next.js build needed.
      # The Android app loads https://restoreassist.app directly.
      # We only need cap sync to copy native plugins.
      - name: Sync Capacitor Android
        run: |
          mkdir -p android/app/src/main/assets/public
          npx --no-install cap sync android

      # ─────────────────────────────────────────────────────────────
      # SECRET HANDLING — pass via env, never interpolate ${{ secrets.* }}
      # directly into a `run:` shell script. Direct interpolation is
      # vulnerable to command injection if any secret ever contains
      # shell metacharacters.
      # ─────────────────────────────────────────────────────────────

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/restoreassist-release.jks

      - name: Build signed AAB
        working-directory: android
        env:
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/restoreassist-release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEY_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: restoreassist-release-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.restoreassist.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f android/app/restoreassist-release.jks

      - name: Notify on success
        if: success()
        run: echo "✅ Android AAB built and uploaded to Google Play internal track"
