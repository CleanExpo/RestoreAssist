name: Weekly production dependency security scan
on:
  schedule:
    - cron: '0 13 * * 1'   # 23:00 UTC Monday = 09:00 AEST Tuesday
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        env:
          HUSKY: "0"
      - name: Release bootstrap guard
        run: node scripts/ci/check-release-bootstrap.mjs
      - name: Audit production dependency closure
        run: npm run audit:prod
      - name: Scan complete git history for secrets
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          ARCHIVE_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL --retry 3 --retry-delay 5 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}" \
            -o "/tmp/${ARCHIVE}"
          echo "${ARCHIVE_SHA256}  /tmp/${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner
      - name: Open issue on findings
        if: failure()
        run: |
          gh issue create \
            --title "[security] Weekly production dependency findings $(date +%Y-%m-%d)" \
            --body "The locked production dependency audit failed. See this workflow run for the exact advisory or bootstrap failure."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
