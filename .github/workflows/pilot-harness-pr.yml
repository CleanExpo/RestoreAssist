name: Pilot harness self-test (PR only - no live swarm)

on:
  pull_request:
    paths:
      - "packages/pilot-tester/**"
      - "app/api/pilot-tester/**"
      - "app/api/inspections/[id]/assessments/[type]/generate/**"
      - "lib/pilot-tester/**"
      - "lib/ai/adjuster-agent.ts"
      - "lib/ai/restoreassist-ai-client.ts"
      - "lib/workspace/permissions.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - ".github/workflows/pilot-canary.yml"
      - ".github/workflows/pilot-harness-pr.yml"

permissions:
  contents: read

concurrency:
  group: pilot-harness-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Harness tests and dry-run (live pilot not requested)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install workspace deps
        run: npm ci --ignore-scripts
        env:
          HUSKY: "0"
      - name: Vitest
        working-directory: packages/pilot-tester
        run: npm test
      - name: Dry-run
        working-directory: packages/pilot-tester
        run: npm run dryrun
