name: RLS Tenant Isolation

# RA-6685 — the scripts/rls-harness (RA-4956) proves tenant A cannot read tenant
# B's rows under the `authenticated` role, but nothing ran it: `grep rls
# .github/workflows/` found only lighthouse. Only the STATIC
# audit-rls-coverage.test.ts ran, which by its own header does NOT prove
# runtime isolation. This wires the real harness in.
#
# Scoped to PRs that touch migrations (or the harness itself) — RLS policies
# live in migration files, so a migration is the only thing that can break the
# isolation guarantee. The Makefile spins up and tears down its own disposable
# postgres:16 via Docker (both Docker and psql are preinstalled on
# ubuntu-latest), so this job needs no `services:` block and never touches a
# remote database (run.sh refuses any non-localhost DATABASE_URL).

on:
  pull_request:
    branches: [main, sandbox]
    paths:
      - "**/migrations/**"
      - "scripts/rls-harness/**"
  # Manual run on any ref (e.g. main after a direct push). base_ref is
  # required: without it the initplan lint would diff main against itself,
  # find no changed migrations and pass without checking anything.
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Commit or ref the lint diffs against (the pre-change base)"
        required: true

permissions:
  contents: read

concurrency:
  group: rls-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # WS4 (RA-1807 remediation) — fast static forward-guard: any NEW/changed
  # migration policy predicate must wrap zero-arg auth.*() in (select …) so it
  # can't reintroduce the RA-4827 → RA-4956 auth_rls_initplan regression. Scans
  # BOTH prisma/migrations and docs/ops/supabase-migrations-archive (policies live in both roots).
  # fetch-depth: 0 so `git merge-base` against the PR base resolves.
  rls-initplan-lint:
    name: RLS InitPlan forward-guard (static)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A dispatch must name a base that leaves something to lint. "required"
      # only stops an empty input: base_ref = HEAD, origin/main after a direct
      # push, or a bare `main` (not fetched here) all leave zero migrations in
      # range, and the lint then exits 0 having checked nothing.
      - name: Refuse a dispatch base that leaves no migration to lint
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE: ${{ inputs.base_ref }}
        run: |
          git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null \
            || { echo "::error::base_ref '$BASE' is not a commit in this checkout"; exit 1; }
          mb=$(git merge-base "$BASE" HEAD)
          n=$(git diff --name-only "$mb" HEAD -- prisma/migrations docs/ops/supabase-migrations-archive | grep -c '\.sql$' || true)
          echo "migration files changed since $BASE: $n"
          [ "$n" -gt 0 ] \
            || { echo "::error::base_ref '$BASE' leaves no migration to lint; a pass would check nothing"; exit 1; }

      - name: Lint new policy predicates for bare auth.*()
        env:
          LINT_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.event.pull_request.base.ref) }}
        run: node scripts/lint-rls-policy-initplan.mjs

  rls-isolation:
    name: RLS tenant isolation harness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run RLS isolation harness
        run: make -f scripts/rls-harness/Makefile rls-test
