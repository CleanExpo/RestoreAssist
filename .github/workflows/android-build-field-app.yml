name: Android Build — Field App (com.restoreassist.app)

# Legacy reusable build only. Direct triggers were an ungated signed-artifact
# path. New releases must flow through release-gate.yml -> android-release.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed AAB
    runs-on: ubuntu-latest
    environment: mobile-release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "21"
          distribution: "temurin"

      # Server-hosted WebView — no Next.js build needed.
      # The Android app loads https://restoreassist.app directly.
      # We only need cap sync to copy native plugins.
      - name: Sync Capacitor Android
        run: |
          mkdir -p android/app/src/main/assets/public
          npx --no-install cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/restoreassist-release.jks

      - name: Build signed AAB
        working-directory: android
        env:
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/restoreassist-release.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_KEY_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: restoreassist-field-app-release-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Uncomment after adding GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret and
      # completing the closed testing period
