name: Sketch E2E

# RA-6764 — runnable e2e harness for the V2 Sketch workflow. Boots the app
# against an ephemeral Postgres, seeds the e2e login account, and runs the
# real draw/save/estimate flows. Scoped to sketch-touching paths so it doesn't
# run on every PR. NOT a required check yet — it's being stabilised; flip to
# required once it's reliably green.
#
# Mirrors pr-checks.yml's DB bootstrap (CONCURRENTLY pre-resolve) so
# `prisma migrate deploy` applies cleanly on plain Postgres. auth.uid() is
# supplied by 20260401000000_ra_7716_auth_uid_shim, not by a step here.

on:
  pull_request:
    paths:
      - "e2e/**"
      - "components/sketch/**"
      - "app/api/test/sketch-pdf-embed/**"
      - "app/api/inspections/**/sketches/**"
      - "lib/sketch/**"
      - "config/playwright.config.ts"
      - "scripts/seed-e2e-user.ts"
      - ".github/workflows/sketch-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sketch-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sketch-e2e:
    name: Sketch E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b # 0.8.6-pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: e2e-nextauth-secret-not-for-prod-deadbeefdeadbeef
      NEXTAUTH_URL: http://localhost:3000
      E2E_USER_EMAIL: test@restoreassist.app
      E2E_USER_PASSWORD: Test1234!
      # A SECOND tenant and a THIRD, NON-ADMIN user. Without these,
      # security.spec.ts describe 2 (cross-tenant isolation) and describe 6
      # (admin route enforcement) call test.skip() and report as skipped --
      # which is indistinguishable from passing in a run summary. Cross-tenant
      # isolation on a multi-tenant product is the single most valuable
      # assertion in this file and it had never executed anywhere.
      E2E_USER_B_EMAIL: e2e-tenant-b@restoreassist.app
      E2E_USER_B_PASSWORD: Test1234!
      E2E_USER_C_EMAIL: e2e-nonadmin@restoreassist.app
      E2E_USER_C_PASSWORD: Test1234!
      # Turns three cron-auth assertions from skipped into executed. The app
      # and the specs read the same variable in this job, so a literal test
      # value is enough -- no secret is required and none is used. Without it
      # security.spec.ts:152 skips, and a skipped auth check looks exactly
      # like a passing one in the run summary.
      CRON_SECRET: e2e-cron-secret-not-for-prod
      # Must be the STRING "true". The value 1 makes every /api/test/* helper
      # return 403, which reads exactly like a payment bug and is not one.
      # Absent from every workflow in this repo until now, which is why the
      # billing specs could not have been wired in without this line.
      ALLOW_TEST_HELPERS: "true"
      # RA-7562 — lib/env-check.ts lists 8 REQUIRED_VARS and this job supplied 3.
      # The app logged "[env-check] Missing REQUIRED env vars: ..." on every
      # recompile, and three stripe-webhook tests called test.skip() because
      # STRIPE_WEBHOOK_SECRET was absent -- a skipped signature check reads
      # exactly like a passing one in the run summary, which is the same reason
      # CRON_SECRET and ALLOW_TEST_HELPERS are set above.
      #
      # These are LITERAL CI values, not secrets. None of these five exists as a
      # repo secret, and none is needed: the app and the specs read the same
      # variable inside this job, so a shared test value is sufficient.
      #
      # The encryption key deliberately does NOT use the 64-hex shape. A 64-hex
      # literal here is indistinguishable from a real 32-byte key, and the
      # Quality Checks gitleaks scan correctly flagged it as generic-api-key
      # (observed failing on this branch; origin/main scanned clean). The value
      # below is the one this repo already uses for the same variable in
      # build-production-image.yml, and it reads as fake to a human as well as
      # to the scanner. lib/credential-vault.ts resolveKey() accepts an
      # arbitrary string and derives 32 bytes from it via SHA-256, so this is a
      # valid key without looking like one.
      CREDENTIAL_ENCRYPTION_KEY: ci-not-a-real-key
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-placeholder-google-client-secret
      NEXT_PUBLIC_GOOGLE_ANDROID_WEB_CLIENT_ID: ci-placeholder-android.apps.googleusercontent.com
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      # Required as a direct consequence of the line above, and not obvious.
      # lib/stripe.ts exports a Proxy whose every property access runs
      # getInstance(), which throws "STRIPE_SECRET_KEY is not set" on a falsy
      # key. app/api/webhooks/stripe/route.ts reaches the verifier through that
      # Proxy (`stripe.webhooks.constructEvent`) INSIDE its try/catch, so with
      # no key the throw is swallowed and every webhook answers 400 "Invalid
      # signature" — including a correctly signed one. The valid-signature test
      # would fail, and the invalid-signature test would pass without the
      # signature check ever running. A vacuous pass on a signature gate is
      # worse than the skip it replaces, so the key goes in with the secret.
      # STRIPE_SECRET_KEY is RECOMMENDED, not REQUIRED, in lib/env-check.ts, so
      # .claude/done/check-sketch-env.py does not cover this line.
      STRIPE_SECRET_KEY: sk_test_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "1"

      - name: Generate Prisma client
        run: npm run prisma:generate

      # CREATE INDEX CONCURRENTLY can't run inside Prisma's per-migration
      # transaction on plain Postgres — mark them applied (mirrors pr-checks).
      - name: Pre-resolve CONCURRENTLY migrations
        run: |
          npx --no-install prisma migrate resolve --applied 20260407_n1_performance_indexes
          npx --no-install prisma migrate resolve --applied 20260407_perf_composite_indexes
          npx --no-install prisma migrate resolve --applied 20260516010000_inspection_close_terminal_index
          npx --no-install prisma migrate resolve --applied 20260828213100_job_file_audit_intake_replay_guard_index

      - name: Apply migrations
        run: npx --no-install prisma migrate deploy

      - name: Apply and verify paid-audit replay index
        run: scripts/ci/apply-and-verify-job-file-audit-replay-index.sh

      - name: Seed e2e login account
        run: npx --no-install tsx scripts/seed-e2e-user.ts

      # scripts/seed-e2e-user.ts is parameterised by env, so it seeds one
      # account per invocation. A distinct ABN per organisation is REQUIRED:
      # the column is unique, and a hardcoded ABN is exactly what made a
      # second tenant impossible before it was fixed. The ABNs below are
      # different valid values, not variations of the first.
      - name: Seed second tenant (user B)
        run: npx --no-install tsx scripts/seed-e2e-user.ts
        env:
          E2E_USER_EMAIL: e2e-tenant-b@restoreassist.app
          E2E_USER_PASSWORD: Test1234!
          E2E_USER_ROLE: USER
          E2E_ORG_NAME: E2E Tenant B Organisation
          E2E_ORG_LEGAL_NAME: E2E Tenant B Pty Ltd
          E2E_ORG_ABN: "51824753556"

      # E2E_USER_EMAIL is seeded ADMIN, so it cannot answer "is a NON-admin
      # forbidden?". Do NOT downgrade it -- describes 2 and 4 rely on its
      # admin role. A separate USER-role account is the only way describe 6
      # tests what it claims to test.
      - name: Seed non-admin account (user C)
        run: npx --no-install tsx scripts/seed-e2e-user.ts
        env:
          E2E_USER_EMAIL: e2e-nonadmin@restoreassist.app
          E2E_USER_PASSWORD: Test1234!
          E2E_USER_ROLE: USER
          E2E_ORG_NAME: E2E Non-Admin Organisation
          E2E_ORG_LEGAL_NAME: E2E Non-Admin Pty Ltd
          E2E_ORG_ABN: "29002589460"

      - name: Install Playwright (chromium)
        run: npx --no-install playwright install --with-deps chromium

      # playwright.config boots `npm run dev` (PLAYWRIGHT_BASE_URL unset) and the
      # "setup" project logs in before the specs run. We run the deterministic
      # API-level money-path spec here; the broader UI-interaction suite
      # (v2-sketch-workflow.spec.ts) has stale selectors and is stabilised
      # separately before being added.
      - name: Run Sketch E2E
        run: npx --no-install playwright test -c config/playwright.config.ts e2e/sketch-api.spec.ts e2e/sketch-chrome-1280.spec.ts e2e/sketch-image-report-1280.spec.ts e2e/sketch-damage-markers-1280.spec.ts --project=chromium --reporter=line

      # The billing suite had never been executed by any pipeline, so nothing
      # had established whether it passed. Run locally on 2026-09-07 it was
      # 3 pass / 6 fail; after repairing the sign-in cookie jar it is 7 of 9.
      #
      # NO continue-on-error. An earlier version of this step had it, to tolerate
      # two known-red specs -- which also tolerated the OTHER SIX. A regression in
      # any of them would have scored green and said nothing. That is a gate that
      # cannot fail, the exact defect the rest of this branch removes, and it was
      # caught by independent review rather than by me.
      #
      # The two known failures are marked in the SPEC CODE instead, where the
      # marking is specific to them: voluntary-upgrade carries test.fail()
      # (RA-7465, a real defect -- so if it ever passes, the run goes red and
      # tells us), credit-exhaust carries test.fixme() (flaky, unproven, so it
      # must not contribute a green). Everything else fails this step honestly.
      #
      # Specs are named individually on purpose: scripts/ci/check-e2e-coverage.mjs
      # verifies that this workflow actually names each spec the manifest claims
      # it runs, and a directory glob would make every one of those claims false.
      - name: Run billing E2E
        run: >-
          npx --no-install playwright test -c config/playwright.config.ts
          e2e/billing/cancel-flow.spec.ts
          e2e/billing/credit-exhaust.spec.ts
          e2e/billing/feature-gate.spec.ts
          e2e/billing/grandfather.spec.ts
          e2e/billing/multi-tab.spec.ts
          e2e/billing/trial-expired-soft-gate.spec.ts
          e2e/billing/voluntary-upgrade.spec.ts
          e2e/billing/webhook-race.spec.ts
          --project=chromium --reporter=line

      # The 36 specs below were every remaining spec declared unrun because "no pipeline
      # boots the app with a seeded database and an authenticated session". That statement
      # was true when it was written and stopped being true when the billing step above
      # landed: the job now does exactly that, and eight billing specs were observed
      # passing through it. The reason outlived the condition it described.
      #
      # These have never been executed by any pipeline, so nothing here claims they pass.
      # This step exists to find out. Whatever it reports is the first real information
      # anyone has had about them.
      #
      # NO continue-on-error, for the reason written on the billing step: it would tolerate
      # every spec in the list, not just the ones already known to be red, and a regression
      # in any of them would score green.
      #
      # Named individually, not globbed, because scripts/ci/check-e2e-coverage.mjs verifies
      # this workflow actually names each spec the manifest claims it runs.
      #
      # Split into three steps because each playwright invocation boots its own
      # `next dev` (reuseExistingServer is off on CI), and dev mode keeps every route
      # it has compiled in memory. As one step, memory climbed through all 36 specs
      # until the runner was shut down mid-run ("The runner has received a shutdown
      # signal"), three runs in a row at the same test, storage-restore.spec.ts, whose
      # route pulls in googleapis. with-mem-log.sh prints free memory into the step
      # log, the one record that survives a runner being killed.
      #
      # Groups B and C run even when an earlier group fails (!cancelled()), so one red
      # spec does not hide the results of the rest. The job still fails.
      - name: Run remaining E2E (1 of 3)
        run: >-
          bash scripts/ci/with-mem-log.sh
          npx --no-install playwright test -c config/playwright.config.ts
          e2e/account-deletion.spec.ts
          e2e/billing.spec.ts
          e2e/crm-health.spec.ts
          e2e/dr-nrpg-inbound-job.spec.ts
          e2e/health-migrations.spec.ts
          e2e/health.spec.ts
          e2e/help/article-detail.spec.ts
          e2e/help/dropdown-open.spec.ts
          e2e/help/public-mirror.spec.ts
          e2e/help/redirects.spec.ts
          e2e/help/report-honesty.spec.ts
          e2e/help/search-cmd-k.spec.ts
          e2e/invite-tech-already-used.spec.ts
          --project=chromium --reporter=line

      - name: Run remaining E2E (2 of 3)
        if: ${{ !cancelled() }}
        run: >-
          bash scripts/ci/with-mem-log.sh
          npx --no-install playwright test -c config/playwright.config.ts
          e2e/invite-tech-expired.spec.ts
          e2e/invite-tech-google-oauth.spec.ts
          e2e/invite-tech-happy-path.spec.ts
          e2e/ios-billing-gates.spec.ts
          e2e/job-close-preconditions.spec.ts
          e2e/login-callback-url.spec.ts
          e2e/navigation.spec.ts
          e2e/nir-routes-regression.spec.ts
          e2e/procurement.spec.ts
          e2e/security.spec.ts
          e2e/setup-abr-unreachable.spec.ts
          e2e/setup-no-abn.spec.ts
          e2e/setup-resume.spec.ts
          e2e/setup-skip-manual.spec.ts
          e2e/setup-technician-gate.spec.ts
          e2e/setup-website-failure.spec.ts
          --project=chromium --reporter=line

      - name: Run remaining E2E (3 of 3)
        if: ${{ !cancelled() }}
        run: >-
          bash scripts/ci/with-mem-log.sh
          npx --no-install playwright test -c config/playwright.config.ts
          e2e/storage-restore.spec.ts
          e2e/stripe-payment-intent-webhook.spec.ts
          e2e/tech-banner-auto-dismiss.spec.ts
          e2e/tech-evidence-capture-no-modal.spec.ts
          e2e/tech-second-signoff-prefilled.spec.ts
          e2e/tech-signoff-modal-cancel.spec.ts
          e2e/warehouse.spec.ts
          e2e/workshop.spec.ts
          --project=chromium --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
