name: Release Gate (RA-4956)

# Fail-closed production go-live scorer. Runs on every release tag and
# on-demand via workflow_dispatch. Does NOT replace pr-checks.yml — this is the
# cutover gate, not the PR gate. The current production workflow invokes the
# explicit `web` profile; mobile/App Store launch criteria remain in the
# `mobile` profile and are not implicitly scored here.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Release SHA provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify release provenance
        # Runs for tags AND workflow_dispatch. Manual runs are not allowed to
        # turn a feature branch or stale main revision into a release receipt.
        run: node scripts/ci/verify-release-provenance.mjs

  pilot-canary:
    name: Pilot canary on release SHA
    needs: provenance
    # Local reusable workflows are resolved from the caller commit, so the
    # canary and release score exercise the exact same candidate SHA.
    uses: ./.github/workflows/pilot-canary.yml
    secrets: inherit

  score:
    name: Release Gate Score
    needs: [provenance, pilot-canary]
    runs-on: ubuntu-latest
    # Derived from the scorer's own per-criterion budgets, not guessed:
    # scripts/release-gate-score.ts makes 7 shellOK calls -- B3 and B4 at
    # 600s and 5 at the 300s default -- so the scorer alone may legitimately
    # consume 2700s / 45 min without any single criterion being
    # stuck. The previous 30-minute cap could therefore kill the job midway,
    # and because the report is written only at the end, the "if: always()"
    # artifact upload would have nothing to upload -- a silent, evidence-free
    # failure. 75 leaves headroom for checkout, install and browser download.
    timeout-minutes: 75

    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b # 0.8.6-pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      RELEASE_DB_PROFILE: "1"

    steps:
      # The canary is advisory when its secrets are absent, so this job now runs
      # in cases where nothing exercised the sandbox on this SHA. The receipt
      # cannot carry that fact: scripts/ci/verify-release-gate-run.mjs compares
      # release-gate-report.json's top-level keys against a fixed set, so adding
      # a field would break the deploy it is meant to inform. The run has to say
      # it instead -- an annotation and the top of the job summary, both of which
      # a human sees before promoting a release.
      - name: Record whether a canary backs this score
        env:
          CANARY_PROVISIONED: ${{ needs.pilot-canary.outputs.provisioned }}
        run: |
          if [ "$CANARY_PROVISIONED" = "true" ]; then
            echo "Pilot canary graded this SHA."
            echo "Pilot canary: graded this SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=Score carries no canary evidence::The pilot canary did not grade this SHA (its secrets are not provisioned), so nothing here exercised the sandbox end to end. The release-gate report cannot record this -- it is only in this run."
          {
            echo "> **No canary evidence backs this score.**"
            echo "> The pilot canary did not grade this SHA because its secrets are"
            echo "> not provisioned, so no end-to-end sandbox run stands behind the"
            echo "> criteria below. The signed report cannot express this; provision"
            echo "> the eight PILOT_TESTER secrets to restore it."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node (pinned via .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          # Skip Prisma generate-on-install since we run it explicitly below
          PRISMA_SKIP_POSTINSTALL_GENERATE: "1"

      - name: Release bootstrap guard
        run: node scripts/ci/check-release-bootstrap.mjs

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Bootstrap Supabase auth.uid() stub for release tests
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
              LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$;
          "

      - name: Pre-resolve CONCURRENTLY migrations for release Postgres
        run: |
          npx --no-install prisma migrate resolve --applied 20260407_n1_performance_indexes
          npx --no-install prisma migrate resolve --applied 20260407_perf_composite_indexes
          npx --no-install prisma migrate resolve --applied 20260516010000_inspection_close_terminal_index
          npx --no-install prisma migrate resolve --applied 20260828213100_job_file_audit_intake_replay_guard_index

      - name: Apply migrations for DB-backed release tests
        run: npx --no-install prisma migrate deploy

      # B4-smoke-sandbox is scored by shelling out to
      # `npm run test:smoke:sandbox`, which drives a real Chromium. Without this
      # step Playwright has no browser binary and B4 fails on
      # "Executable doesn't exist" -- a harness failure indistinguishable, in
      # the scorer's recorded detail, from a genuine smoke failure. Mirrors
      # smoke-prod.yml; chromium only, because the @smoke suite is light.
      - name: Install Playwright browsers (chromium only — smoke is light)
        run: npx --no-install playwright install --with-deps chromium

      - name: Run release gate scorer
        id: gate
        # The scorer receives no secrets. Its smoke suite exercises public
        # surfaces only, so a BotID bypass is neither required nor permitted.
        # Every invocation is strict. A manual run is diagnostic only and may
        # never weaken the production threshold.
        run: npx --no-install tsx scripts/release-gate-score.ts --profile=web --json --strict

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-report-${{ github.sha }}
          path: release-gate-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarise in job summary
        if: always()
        run: |
          if [ -f release-gate-report.json ]; then
            SCORE=$(node -p "require('./release-gate-report.json').total_score")
            MAX=$(node -p "require('./release-gate-report.json').max_score")
            VERSION=$(node -p "require('./release-gate-report.json').gate_version")
            PASSED=$(node -p "require('./release-gate-report.json').passed")
            {
              echo "# Release Gate $VERSION"
              echo ""
              echo "**Score: $SCORE / $MAX** — passed: $PASSED"
              echo ""
              echo "See artifact \`release-gate-report-${{ github.sha }}\` for full per-criterion breakdown."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
