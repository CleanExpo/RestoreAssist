name: Release Gate (RA-4956)

# Fail-closed 100/100 production go-live scorer. Runs on every release tag
# and on-demand via workflow_dispatch. Does NOT replace pr-checks.yml — this
# is the cutover gate, not the PR gate.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail the job if score < 100"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  score:
    name: Release Gate Score
    runs-on: ubuntu-latest
    # Derived from the scorer's own per-criterion budgets, not guessed:
    # scripts/release-gate-score.ts makes 9 shellOK calls -- 3 at 600s
    # (A1, B3, B4) and 6 at the 300s default -- so the scorer alone may
    # legitimately consume 3600s / 60 min without any single criterion being
    # stuck. The previous 30-minute cap could therefore kill the job midway,
    # and because the report is written only at the end, the "if: always()"
    # artifact upload would have nothing to upload -- a silent, evidence-free
    # failure. 75 leaves headroom for checkout, install and browser download.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node (pinned via .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Skip Prisma generate-on-install since we run it explicitly below
          PRISMA_SKIP_POSTINSTALL_GENERATE: "1"

      - name: Generate Prisma client
        run: pnpm prisma:generate

      # A1-core-journeys and B4-smoke-sandbox are scored by shelling out to
      # `pnpm test:smoke:sandbox`, which drives a real Chromium. Without this
      # step Playwright has no browser binary and both criteria fail on
      # "Executable doesn't exist" -- a harness failure indistinguishable, in
      # the scorer's recorded detail, from a genuine smoke failure. Mirrors
      # smoke-prod.yml; chromium only, because the @smoke suite is light.
      - name: Install Playwright browsers (chromium only — smoke is light)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release gate scorer
        id: gate
        env:
          # RA-4987 secret-gated BotID bypass. Playwright injects this as the
          # x-smoke-test-token header (config/playwright.config.ts) and the app
          # timing-safe-compares it.
          #
          # MEASURED 2026-08-16: this secret is NOT currently set on this repo
          # (`gh api .../actions/secrets/SMOKE_TEST_BOT_BYPASS_SECRET` -> 404,
          # and CleanExpo is a user account, so no org-secret fallback exists).
          # It therefore resolves to an empty string and the header is omitted.
          # That is not currently a problem: smoke-prod.yml consumes the same
          # unset secret and has been green every 15 minutes, because the
          # @smoke suite only performs GETs on public surfaces and never posts
          # to a BotID-protected endpoint. Wired here so the gate picks the
          # bypass up automatically if the secret is ever provisioned -- do not
          # read its presence as evidence that a bypass is active.
          SMOKE_TEST_BOT_BYPASS_SECRET: ${{ secrets.SMOKE_TEST_BOT_BYPASS_SECRET }}
        # strict mode is the default for tag pushes; workflow_dispatch
        # honours the input. The scorer writes release-gate-report.json
        # in --json mode regardless of strict mode.
        run: |
          STRICT_FLAG=""
          if [ "${{ github.event.inputs.strict || 'true' }}" = "true" ]; then
            STRICT_FLAG="--strict"
          fi
          pnpm tsx scripts/release-gate-score.ts --json $STRICT_FLAG

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-report-${{ github.sha }}
          path: release-gate-report.json
          retention-days: 90

      - name: Summarise in job summary
        if: always()
        run: |
          if [ -f release-gate-report.json ]; then
            SCORE=$(node -p "require('./release-gate-report.json').total_score")
            MAX=$(node -p "require('./release-gate-report.json').max_score")
            VERSION=$(node -p "require('./release-gate-report.json').gate_version")
            PASSED=$(node -p "require('./release-gate-report.json').passed")
            {
              echo "# Release Gate $VERSION"
              echo ""
              echo "**Score: $SCORE / $MAX** — passed: $PASSED"
              echo ""
              echo "See artifact \`release-gate-report-${{ github.sha }}\` for full per-criterion breakdown."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
