# gitleaks configuration — RA-4985 triage of 127 historical findings
#
# Approach: extend the default config (`extend.useDefault = true`), then
# add narrowly-scoped allowlists ONLY for findings classified as
# false-positives or historical-no-longer-tracked during the 2026-05-18 audit.
#
# The full audit is in docs/evidence/release-gate/1.0.0/C2-secrets-scan.md.

[extend]
useDefault = true

# --- Allowlist: false-positives + historical-no-longer-in-tracked-code ---
#
# Each entry must justify itself. Don't add to this list without inspecting
# the underlying finding and documenting WHY it's safe to skip.

[[rules]]
id = "ra-4985-historical-removed-files"
description = "Findings in files that no longer exist in the working tree (Dockerfile, STRIPE_CONFIGURATION_STATUS.md, packages/frontend/.env.*, etc.). Historical commits remain, but the tracked content has been removed."
regex = '''(?i)historical-removed-marker-not-a-real-rule'''
# This rule never fires; serves as documentation. Allowlist below excludes
# the historical paths.

[[rules]]
id = "composio-api-key"
description = "Composio API key"
regex = '''\bck_[A-Za-z0-9_-]{8,}\b'''
keywords = ["ck_"]

[[allowlists]]
description = "RA-4985 audit allowlist — 2026-05-18"

# Paths NO LONGER in the working tree (verified via `git ls-files`).
# These produced 18 of the 28 non-doc findings.
paths = [
  '''(?i)^Dockerfile$''',
  '''(?i)^docker/docker-compose\.yml$''',
  '''(?i)^STRIPE_CONFIGURATION_STATUS\.md$''',
  '''(?i)^packages/frontend/\.env\.''',
  '''(?i)^apps/backend/tests/security/test_api_security\.py$''',
  '''(?i)^packages/backend/tests/unit/claudeService\.test\.ts$''',
  '''(?i)^scripts/setup-supabase\.ps1$''',
  '''(?i)^\.speckit/features/current/contracts/auth-api\.yaml$''',
  '''(?i)^\.claude/local-test-results\.json$''',

  # NOTE (2026-08-16, release-gate criterion C2): a blanket '''(?i)\.md$''' USED to sit here,
  # exempting every markdown file in the repository from every rule. It was
  # added in 2026-05 to silence 99 findings whose files no longer exist. The
  # cost was that a real credential committed to any .md was invisible, and a
  # measured differential proved it: with the line present a planted
  # Stripe-shaped key in a root .md scanned as "no leaks found"; with the line
  # removed the same scan caught it via `stripe-access-token`.
  #
  # It is removed. Markdown is scanned like everything else. Re-running the
  # scan against the whole working tree with it gone produced exactly ONE
  # finding, handled by the narrow `regexes` entry below rather than by
  # exempting a file class again. Exempting a whole class is what created this
  # hole; a smaller version of the same mistake is still the same mistake.

  # `.env.example` + `apps/*/.env.example` — template files with placeholder
  # values by design ("sk_test_...", "AKIA...", etc.).
  '''(?i)\.env\.example$''',

  # Local-only secret files — gitignored, never committed. The --no-git
  # scan mode does NOT respect .gitignore, so the allowlist must do it.
  # Verified via `git check-ignore -v`: every path below is gitignored.
  '''(?i)^\.env\.''',
  '''(?i)/\.env(\.|$)''',
  '''(?i)^\.env$''',

  # Gitignored, local-only parts of `.claude/` (agent worktrees, Done
  # contracts, local progress notes). `.claude/skills/` and
  # `.claude/verifier-reports/` are NOT here: 65 + 151 of their files are
  # tracked, so CI must scan them.
  #
  # NOTE (2026-10-31): this used to be a blanket '''(?i)^\.claude/''', which
  # also exempted the ~330 TRACKED files under `.claude/` (rules, hooks,
  # agents, settings). A planted fake GitHub token in a tracked `.claude/`
  # file scanned as "no leaks found" while the same token in `lib/` was
  # caught. Only the gitignored subpaths are exempt now; tracked `.claude/`
  # content is scanned like everything else.
  '''(?i)^\.claude/worktrees/''',
  '''(?i)^\.claude/done/''',
  '''(?i)^\.claude/swarm/identity\.local\.md$''',
  '''(?i)^\.claude/PROGRESS\.md$''',

  # Next.js build output — `.next/` is gitignored build artefact.
  '''(?i)^\.next/''',

  # node_modules / pnpm store — third-party code, not our secrets to leak.
  '''(?i)^node_modules/''',

  # Vercel CLI cache — local-only.
  '''(?i)^\.vercel/''',

  # Playwright test results / report artifacts — local-only.
  '''(?i)^test-results/''',
  '''(?i)^playwright-report/''',

  # Unit-test fixtures are NOT exempt here any more — see the targeted
  # [[allowlists]] entry for `generic-api-key` at the end of this file.

]

# Do not allowlist the historical `.codex/config.toml` finding until an
# independently retained receipt proves the exposed Composio credential was
# rotated. Deleting the current file cannot revoke a credential already present
# in public history.

# Specific regex matches — for the ios-release.yml Apple cert pattern that
# triggers private-key detection. The "private key" content there is
# actually base64-decoded from `secrets.IOS_DIST_P12_BASE64` (a GitHub
# Actions secret), not committed as plaintext.
regexes = [
  '''(?i)IOS_DIST_P12_BASE64''',

  # Release-gate criterion C2. The only finding left once the blanket `.md`
  # exemption above was removed. It is a deliberately-invalid webhook secret in
  # C2's own evidence file, used to demonstrate that signature verification
  # REJECTS a wrong secret — the string says so in its own name. Allowlisted by
  # value rather than by file path, so the rest of that evidence file, and every
  # other markdown file, stays scanned.
  #
  # ANCHORED deliberately. gitleaks matches allowlist `regexes` against the
  # detected SECRET (verified: this finding reports Secret =
  # `whsec_definitely_wrong_secret_ra1103`), and an unanchored pattern would
  # suppress any future secret merely CONTAINING this string as a substring —
  # a small blind spot, and one that would contradict the "by value" claim
  # above. `^...$` makes the entry mean exactly what the comment says.
  '''^whsec_definitely_wrong_secret_ra1103$''',
]

# Lib files using NEXT_PUBLIC_* env-var references for Firebase Web API
# keys (which are PUBLIC by design per Firebase docs — they identify the
# project, not authenticate). Match the `process.env.NEXT_PUBLIC_FIREBASE_*`
# reference pattern.
stopwords = [
  "process.env.NEXT_PUBLIC_FIREBASE_API_KEY",
]

# Unit-test fixtures (2026-10-31). These files hold synthetic tokens,
# idempotency keys and encryption keys to exercise validation, encryption and
# live/test-mode guards. They used to be exempt from EVERY rule via a path
# entry above, so a real provider credential pasted into any of ~1,280 test
# files was invisible (measured: a planted fake `ghp_` token in a test file
# scanned clean). Every finding those fixtures produced was the fuzzy,
# entropy-based `generic-api-key` rule, so that is the only rule they are
# exempt from. Provider-specific rules (github-pat, stripe-access-token,
# aws-access-token, private-key, ...) still fire inside test files.
[[allowlists]]
description = "Unit-test fixtures: exempt from generic-api-key only"
targetRules = ["generic-api-key"]
paths = ['''(?i)__tests__/.*\.test\.ts$''']
