name: restore-assist
region: syd
# RELEASE BLOCKER: this legacy GitHub branch source is mutable even with
# deploy_on_push disabled. The production verifier rejects it. Do not deploy
# until the service uses an independently verified image.digest sha256 value.
domains:
  - domain: restoreassist.app
    type: PRIMARY
services:
  - name: web
    github:
      repo: CleanExpo/RestoreAssist
      branch: main
      deploy_on_push: false
    # Both commands are intentionally non-mutating. Migrations are a separate,
    # approved release operation and are never run by build or process startup.
    build_command: npm run build
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    health_check:
      http_path: /api/health/migrations
    envs:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_APP_HOSTS
        value: restoreassist.app,www.restoreassist.app
        scope: RUN_TIME
        type: GENERAL
      - key: GIT_SHA
        value: ${_self.COMMIT_HASH}
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: CREDENTIAL_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NEXTAUTH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: NEXTAUTH_URL
        value: https://restoreassist.app
        scope: RUN_TIME
        type: GENERAL
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: NEXT_PUBLIC_GOOGLE_ANDROID_WEB_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: TENANT_DATABASE_HOST_ALLOWLIST
        scope: RUN_TIME
        type: SECRET
      - key: TENANT_DATABASE_PROVISIONING_ENABLED
        value: "false"
        scope: RUN_TIME
        type: GENERAL
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PILOT_TESTER_JUDGE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CRON_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        scope: RUN_TIME
        type: SECRET
      - key: ASC_API_KEY_ID
        scope: RUN_TIME
        type: GENERAL
      - key: ASC_ISSUER_ID
        scope: RUN_TIME
        type: GENERAL
